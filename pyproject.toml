[project]
name = "ragproject"
version = "0.1.0"
description = "Confidence-aware hybrid RAG pipeline (dense + BM25 + RRF) with an HCI study harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# Heavy (pulls torch); not needed for tests, which use the hash embedder.
models = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
