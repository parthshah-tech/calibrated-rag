<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask your documents</title>
<style>
:root{--bg:#f4f6f8;--surf:#ffffff;--ink:#1c2733;--muted:#5b6876;--line:#d5dbe2;--acc:#1d7a5a;--low:#b4530a;--mid:#2c6a99;--high:#1d7a5a;--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--surf:#141a22;--ink:#e6ebf0;--muted:#97a4b1;--line:#27313c;--acc:#3ecf8e;--low:#e08a3c;--mid:#6aa8d6;--high:#4fb88f}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;height:100vh}
.side,.panel{background:var(--surf);overflow-y:auto;padding:1rem}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column}
.panel{border-left:1px solid var(--line)}
.side-h,.panel h2{display:flex;justify-content:space-between;align-items:center;margin:0 0 .6rem;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
#new{width:2rem;height:2rem;border:1px solid var(--line);border-radius:6px;background:transparent;font-size:1.2rem;cursor:pointer}
#chats{list-style:none;margin:0;padding:0;flex:1}
#chats li{display:flex;align-items:center;border:1px solid transparent;border-radius:8px;margin-bottom:.25rem}
#chats li.on{border-color:var(--line);background:var(--bg)}
#chats .t{flex:1;text-align:left;border:0;background:transparent;padding:.55rem .6rem;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chats .x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:.4rem .6rem}
.linkish{border:0;background:transparent;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.88rem}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
#scroll{flex:1;overflow-y:auto;padding:1.5rem 1.5rem 0}
.wrap{max-width:44rem;margin:0 auto}
#hero{text-align:center;padding-top:7vh}
#hero canvas{width:240px;height:240px}
#hero h1{font:600 1.9rem/1.2 var(--serif);margin:.5rem 0 .3rem}
#hero p{color:var(--muted);margin:0 auto;max-width:30rem}
.q{margin:1.2rem 0 .4rem;font-weight:600}
.a{margin:0 0 1.6rem}
.how,.by{color:var(--muted);font-size:.85rem;margin:.3rem 0}
.body{font:1.06rem/1.7 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere}
.body a,.link{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
code{font:.92em ui-monospace,Menlo,Consolas,monospace}
.verdict{margin:.9rem 0 0;padding-left:.9rem;border-left:4px solid var(--line)}
.verdict.Low{border-color:var(--low)}.verdict.Medium{border-color:var(--mid)}.verdict.High{border-color:var(--high)}
.verdict b{font:600 1.15rem var(--serif)}
.gauge{display:flex;gap:4px;margin:.3rem 0;max-width:10rem}
.gauge i{flex:1;height:7px;border-radius:2px;background:var(--line)}
.verdict.Low .gauge i:nth-child(1){background:var(--low)}
.verdict.Medium .gauge i:nth-child(-n+2){background:var(--mid)}
.verdict.High .gauge i{background:var(--high)}
.verdict p{margin:.15rem 0;color:var(--muted);font-size:.88rem}
.composer{border-top:1px solid var(--line);padding:.8rem 1.5rem 1rem;background:var(--bg)}
.box{max-width:44rem;margin:0 auto;border:1px solid var(--line);border-radius:14px;background:var(--surf);padding:.6rem .8rem}
textarea{width:100%;border:0;resize:none;background:transparent;outline:none;min-height:2.6rem;max-height:9rem}
.opts{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.opts select{border:1px solid var(--line);border-radius:6px;background:transparent;padding:.25rem .4rem}
.opts label{display:flex;gap:.3rem;align-items:center}
#status{flex:1;min-width:6rem}
.send{border:0;border-radius:999px;background:var(--acc);color:#fff;padding:.45rem 1rem;font-weight:600;cursor:pointer}
.hint{color:var(--muted);font-size:.85rem;margin:.3rem 0 1.2rem}
#docs{list-style:none;margin:0 0 .4rem;padding:0}
#docs li{display:flex;gap:.55rem;align-items:flex-start;padding:.4rem 0}
#docs .n{overflow-wrap:anywhere;font-size:.9rem}
#docs small{color:var(--muted);display:block}
.hit{padding:.8rem 0;border-top:1px solid var(--line)}
.hit.flash{background:color-mix(in srgb,var(--mid) 14%,transparent)}
.src{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;color:var(--muted)}
.src b{color:var(--ink);overflow-wrap:anywhere}
.txt{font:.95rem/1.6 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:.25rem}
mark{background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media (max-width:1000px){.app{grid-template-columns:1fr;height:auto}.side,.panel{border:0;max-height:none}.main{height:auto;min-height:70vh}#scroll{overflow:visible}.side{order:2}.panel{order:3}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Chat history">
    <div class="side-h"><span>History</span><button id="new" aria-label="New chat" title="New chat">+</button></div>
    <ul id="chats"></ul>
    <button class="linkish" id="add" type="button">Add a document</button>
    <input id="file" type="file" accept=".txt,.md,.pdf,.docx" hidden>
  </aside>
  <main class="main">
    <div id="scroll"><div class="wrap">
      <section id="hero"><canvas id="cv" width="480" height="480" aria-hidden="true"></canvas>
        <h1>Ask your documents</h1>
        <p>Answers come only from the sources you tick on the right, with the passages they used.</p></section>
      <div id="thread"></div>
    </div></div>
    <form id="f" class="composer">
      <div class="box">
        <textarea id="q" rows="1" placeholder="Ask about your documents..." aria-label="Question"></textarea>
        <div class="opts">
          <select id="mode" aria-label="Search method"><option value="hybrid">Hybrid</option><option value="dense">Meaning only</option><option value="bm25">Keywords only</option></select>
          <label><input type="checkbox" id="broad"> Broaden search</label>
          <label><input type="checkbox" id="sharp"> Sharper ranking</label>
          <span id="status" role="status" aria-live="polite"></span>
          <button class="send" type="submit">Send</button>
        </div>
      </div>
    </form>
  </main>
  <aside class="panel" aria-label="Sources and passages">
    <h2><span>Sources</span><span><button class="linkish" id="all" type="button">all</button> <button class="linkish" id="none" type="button">none</button></span></h2>
    <ul id="docs"></ul>
    <p class="hint" id="dochint"></p>
    <h2><span>Passages used</span></h2>
    <div id="passages"><p class="hint">Passages for the selected answer appear here.</p></div>
  </aside>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = "calrag.v1";
let S = {chats: [], active: null, sel: null, docs: [], pm: null};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (_) {}
S.docs = []; S.pm = null;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({chats: S.chats, active: S.active, sel: S.sel})); } catch (_) {} };
const chat = () => S.chats.find(c => c.id === S.active);
const MEANING = {
  Low: ["Low confidence", "The two search methods disagree about what matches. Check the passages before relying on this."],
  Medium: ["Medium confidence", "The search methods partly agree. The passages are worth a quick read."],
  High: ["High confidence", "Both search methods agree on the top passages."]
};
const STOP = new Set("the and for are was how who what why you your can with this that from have does did not when where which".split(" "));
function tidy(t) {
  return t.split("\n").map(l => (l.includes("|") ? l.replace(/[ \t]{2,}/g, " ") : l)).join("\n").replace(/\*\*/g, "").replace(/\n{3,}/g, "\n\n").trim();
}
function highlight(text, query) {
  const terms = (query.toLowerCase().match(/\w{3,}/g) || []).filter((t, i, a) => a.indexOf(t) === i && !STOP.has(t));
  let html = esc(tidy(text));
  if (terms.length) html = html.replace(new RegExp("\\b(" + terms.join("|") + ")\\b", "gi"), "<mark>$1</mark>");
  return html;
}
const inlineMd = h => h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>").replace(/`([^`\n]+)`/g, "<code>$1</code>");
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let d = r.statusText;
    try { const j = await r.json(); d = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch (_) {}
    throw new Error(d);
  }
  return r.json();
}
function howHtml(d) {
  const bits = [];
  if (d.rewritten_query) bits.push(`Searched for: ${esc(d.rewritten_query)}`);
  if (d.expansions && d.expansions.length) bits.push(`Also searched: ${d.expansions.map(esc).join("; ")}`);
  if (d.reranked) bits.push(`Sharper ranking: re-scored the top ${+((d.trace.counters || {}).rerank_pairs) || ""} candidates`);
  (d.notes || []).forEach(n => bits.push(esc(n)));
  return bits.length ? `<p class="how">${bits.join("<br>")}</p>` : "";
}
function verdict(c) {
  if (!c) return "";
  const [t, x] = MEANING[c.bucket];
  return `<div class="verdict ${c.bucket}"><b>${t}</b><div class="gauge" aria-hidden="true"><i></i><i></i><i></i></div>
    <p>${x} This reflects how well the search found passages, not whether the answer is correct. Agreement ${c.score.toFixed(2)}; cutoffs are provisional.</p></div>`;
}
function answerHtml(d, mi) {
  if (!d.answer) return d.answer_error ? `<p class="by">No written answer: ${esc(d.answer_error)}</p>` : "";
  const a = d.answer;
  const body = inlineMd(esc(a.text)).replace(/\[(\d+)\]/g, (m, n) =>
    +n >= 1 && +n <= a.sources ? `<a href="#" class="cite" data-m="${mi}" data-n="${n}">[${n}]</a>` : m);
  const by = a.refused ? "The documents don't seem to answer this question."
    : a.cited.length ? `Written by ${esc(a.model)} from the passages${a.cached ? " (saved earlier answer)" : ""}.`
    : "This answer cites no passages, so check it against them.";
  return `<div class="body">${body}</div><p class="by">${by}</p>`;
}
function renderThread() {
  const c = chat(), msgs = c ? c.msgs : [];
  $("hero").hidden = msgs.length > 0;
  $("thread").innerHTML = msgs.map((m, i) => m.role === "user"
    ? `<div class="q">${esc(m.text)}</div>`
    : m.error ? `<div class="a"><p class="by">Search failed: ${esc(m.error)}</p></div>`
    : `<div class="a">${howHtml(m.data)}${answerHtml(m.data, i)}${verdict(m.data.confidence)}
       <p class="by"><a href="#" class="link cite" data-m="${i}">Show ${m.data.results.length} passages</a></p></div>`).join("");
  $("scroll").scrollTop = $("scroll").scrollHeight;
}
function renderPassages(mi, flash) {
  const c = chat(), m = c && c.msgs[mi];
  S.pm = mi;
  if (!m || !m.data) { $("passages").innerHTML = '<p class="hint">Passages for the selected answer appear here.</p>'; return; }
  const q = (c.msgs[mi - 1] || {}).text || "";
  $("passages").innerHTML = m.data.results.map((r, i) => `<div class="hit" id="p-${i + 1}"><div class="src"><b>${i + 1}. ${esc(r.source)}</b><span>${r.start} to ${r.end}</span></div>
    <div class="txt">${highlight(r.text, q)}</div></div>`).join("") || '<p class="hint">No passages matched.</p>';
  if (flash) { const el = $("p-" + flash); if (el) { el.scrollIntoView({block: "nearest"}); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); } }
}
function renderChats() {
  $("chats").innerHTML = S.chats.map(c => `<li class="${c.id === S.active ? "on" : ""}"><button class="t" data-id="${c.id}">${esc(c.title)}</button><button class="x" data-del="${c.id}" aria-label="Delete chat">x</button></li>`).join("")
    || '<li><span class="hint" style="padding:.5rem">No chats yet.</span></li>';
}
function renderDocs() {
  $("docs").innerHTML = S.docs.map(d => `<li><input type="checkbox" id="d-${d.doc_id}" data-doc="${d.doc_id}" ${S.sel.includes(d.doc_id) ? "checked" : ""}>
    <label for="d-${d.doc_id}" class="n">${esc(d.source)}<small>${d.chunks} passages</small></label></li>`).join("");
  $("dochint").textContent = S.docs.length ? `${S.sel.length} of ${S.docs.length} selected. Only ticked sources are searched.` : "No documents yet. Use Add a document.";
}
async function loadDocs(newId) {
  try { S.docs = await api("/documents"); } catch (_) { S.docs = []; }
  const ids = S.docs.map(d => d.doc_id);
  S.sel = S.sel === null ? ids : S.sel.filter(i => ids.includes(i));
  if (newId && ids.includes(newId) && !S.sel.includes(newId)) S.sel.push(newId);
  renderDocs(); save();
}
function newChat() {
  const c = {id: String(Date.now()), title: "New chat", msgs: []};
  S.chats.unshift(c); S.active = c.id; S.pm = null;
  renderChats(); renderThread(); renderPassages(-1); save(); $("q").focus();
}
async function send(e) {
  e.preventDefault();
  const query = $("q").value.trim();
  if (!query) return;
  if (!S.docs.length) { $("status").textContent = "Add a document first."; return; }
  if (!S.sel.length) { $("status").textContent = "Tick at least one source."; return; }
  if (!chat()) newChat();
  const c = chat();
  const history = c.msgs.map(m => m.role === "user" ? {role: "user", content: m.text}
    : m.data && m.data.answer && !m.data.answer.refused ? {role: "assistant", content: m.data.answer.text} : null).filter(Boolean).slice(-6);
  c.msgs.push({role: "user", text: query});
  if (c.title === "New chat") c.title = query.slice(0, 40);
  $("q").value = ""; $("status").textContent = "Searching and writing an answer...";
  renderChats(); renderThread();
  try {
    const data = await api("/ask", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({
      query, k: 5, mode: $("mode").value, history, expand: $("broad").checked ? 3 : 0, rerank: $("sharp").checked, doc_ids: S.sel})});
    c.msgs.push({role: "assistant", data});
    $("status").textContent = `${data.results.length} passages in ${Math.round(data.trace.total_ms)} ms`;
  } catch (err) {
    c.msgs.push({role: "assistant", error: err.message}); $("status").textContent = "";
  }
  save(); renderThread();
  const last = c.msgs.length - 1;
  renderPassages(c.msgs[last].data ? last : -1);
}
$("f").addEventListener("submit", send);
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); } });
$("q").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 144) + "px"; });
$("new").addEventListener("click", newChat);
$("chats").addEventListener("click", e => {
  const id = e.target.dataset.id, del = e.target.dataset.del;
  if (del) { S.chats = S.chats.filter(c => c.id !== del); if (S.active === del) S.active = S.chats[0] ? S.chats[0].id : null; }
  else if (id) S.active = id; else return;
  save(); renderChats(); renderThread(); renderPassages(-1);
});
$("thread").addEventListener("click", e => {
  const a = e.target.closest(".cite"); if (!a) return;
  e.preventDefault(); renderPassages(+a.dataset.m, a.dataset.n);
});
$("docs").addEventListener("change", e => {
  const id = e.target.dataset.doc; if (!id) return;
  S.sel = e.target.checked ? [...new Set([...S.sel, id])] : S.sel.filter(i => i !== id);
  renderDocs(); save();
});
$("all").addEventListener("click", () => { S.sel = S.docs.map(d => d.doc_id); renderDocs(); save(); });
$("none").addEventListener("click", () => { S.sel = []; renderDocs(); save(); });
$("add").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async () => {
  const f = $("file").files[0]; if (!f) return;
  $("status").textContent = `Adding ${f.name}...`;
  const body = new FormData(); body.append("file", f);
  try {
    const d = await api("/ingest", {method: "POST", body});
    await loadDocs(d.doc_id);
    $("status").textContent = d.skipped ? `${f.name} was already added.` : `Added ${f.name}: ${d.n_chunks} passages.`;
  } catch (err) { $("status").textContent = `Could not add ${f.name}: ${err.message}`; }
  $("file").value = "";
});
// the slowly turning icosahedron in the empty state
(function hero() {
  const cv = $("cv"), g = cv.getContext("2d"), p = (1 + Math.sqrt(5)) / 2;
  const V = [[-1,p,0],[1,p,0],[-1,-p,0],[1,-p,0],[0,-1,p],[0,1,p],[0,-1,-p],[0,1,-p],[p,0,-1],[p,0,1],[-p,0,-1],[-p,0,1]];
  const E = [];
  V.forEach((a, i) => V.forEach((b, j) => { if (j > i && Math.abs(Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]) - 2) < 1e-6) E.push([i, j]); }));
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t = 0;
  function draw() {
    if ($("hero").hidden && !still) { setTimeout(draw, 500); return; }
    const acc = getComputedStyle(document.documentElement).getPropertyValue("--acc").trim() || "#3ecf8e";
    g.clearRect(0, 0, 480, 480); g.strokeStyle = acc; g.lineWidth = 1.5;
    [[236, .35], [212, .6]].forEach(([r, a]) => { g.globalAlpha = a; g.beginPath(); g.arc(240, 240, r, 0, 7); g.stroke(); });
    const ca = Math.cos(t), sa = Math.sin(t), cb = Math.cos(t * .6), sb = Math.sin(t * .6);
    const P = V.map(([x, y, z]) => { const x1 = x * ca + z * sa, z1 = -x * sa + z * ca, y1 = y * cb - z1 * sb, z2 = y * sb + z1 * cb; const s = 330 / (6 - z2); return [240 + x1 * s * .62, 240 + y1 * s * .62, z2]; });
    E.forEach(([i, j]) => { g.globalAlpha = .35 + .35 * ((P[i][2] + P[j][2]) / 2 + 2) / 4; g.beginPath(); g.moveTo(P[i][0], P[i][1]); g.lineTo(P[j][0], P[j][1]); g.stroke(); });
    t += .006;
    if (!still && !$("hero").hidden) requestAnimationFrame(draw); else if (!still) setTimeout(draw, 400);
  }
  draw();
})();
(async function init() {
  await loadDocs();
  if (S.active && !chat()) S.active = null;
  if (!S.active && S.chats.length) S.active = S.chats[0].id;
  renderChats(); renderThread();
  const c = chat(); if (c) { const i = c.msgs.length - 1; renderPassages(i >= 0 && c.msgs[i].data ? i : -1); }
})();
</script>
</body>
</html>
